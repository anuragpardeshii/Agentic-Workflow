services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports: ["127.0.0.1:${FRONTEND_PORT:-5174}:5173"]
    environment:
      DEV_PORT: "5173"
      DEV_STRICT_PORT: "true"
      API_PROXY_TARGET: http://backend:3000
      USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build: ./backend
    command: npm run dev
    env_file: .env
    environment:
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017/buildfast
      OLLAMA_URL: http://ollama:11434
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5174}
    ports: ["127.0.0.1:${API_PORT:-3001}:3000"]
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  mongo:
    image: mongo:7
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
  ollama:
    image: ollama/ollama:0.12.3
    profiles: ["local-ai"]
    volumes: ["ollama_data:/root/.ollama"]
volumes:
  frontend_modules:
  backend_modules:
  mongo_data:
  ollama_data:
